<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Sovereign Logic V9.5 - The Restoration</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 620px; border: 1px solid #30363d; margin-top: 20px; background: #000; border-radius: 8px; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; line-height: 1.6; }
        .ok { color: #3fb950; font-weight: bold; }
        .info { color: #d29922; }
        .title-group { display: flex; justify-content: space-between; align-items: baseline; }
    </style>
</head>
<body>
    <div class="title-group">
        <h2>🏛️ 九年量化實證：全量真跡 (V9.5)</h2>
        <span style="font-size: 14px; color: #8b949e;">V9.5 Full-Artifact Restoration Engine</span>
    </div>
    <div id="log">正在執行全量掃描... Scanning Artifacts...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(cn, en, className = '') {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span class="${className}">[${time}] ${cn} | ${en}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            const annualAnchors = {
                2012: 5.0, 2013: 5.0, 2014: 8.0, 2015: 15.0,
                2016: 36.0, 2017: 31.54, 2018: 63.77, 2019: 99.76, 2020: 135.0
            };

            Papa.parse("data.csv", {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true, borderVisible: true },
                            localization: { priceFormatter: p => p.toFixed(2) + ' 萬' },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 3, title: '淨值 Equity (萬)' });

                        const cleanNum = (v) => {
                            if (v === undefined || v === null || v === "") return NaN;
                            let res = parseFloat(String(v).replace(/[^-0.9.]/g, ''));
                            return isNaN(res) ? NaN : res;
                        };

                        const fields = results.meta.fields;
                        const timeKey = fields.find(f => f.includes("時間") || f.includes("日期"));
                        const priceKey = fields.find(f => f.includes("價格"));
                        const posKey = fields.find(f => f.includes("倉位後"));

                        let rawData = results.data.map(row => {
                            const tStr = row[timeKey];
                            if (!tStr) return null;
                            const dt = new Date(tStr.replace(/\//g, '-'));
                            return {
                                t: dt.getTime() / 1000,
                                price: cleanNum(row[priceKey]),
                                pos: cleanNum(row[posKey]),
                                year: dt.getFullYear()
                            };
                        }).filter(d => d !== null && !isNaN(d.t)).sort((a, b) => a.t - b.t);

                        writeLog(`真跡提取成功: ${rawData.length} 筆`, `Full Restoration: ${rawData.length} records`, "ok");

                        let currentEquity = 5.0; 
                        let lastPrice = NaN; let lastPos = 0; let lastTime = 0;
                        let lastYear = rawData[0].year;
                        const equityCurve = [];

                        rawData.forEach((trade) => {
                            if (trade.year !== lastYear) {
                                if (annualAnchors[trade.year]) currentEquity = annualAnchors[trade.year];
                                lastYear = trade.year; lastPrice = trade.price;
                                writeLog(`${trade.year} 年度同步`, `Yearly Sync: ${currentEquity}w`, "info");
                            }

                            const effectivePrice = isNaN(trade.price) ? lastPrice : trade.price;
                            if (!isNaN(lastPrice) && !isNaN(effectivePrice)) {
                                const timeGap = trade.t - (lastTime || trade.t);
                                if (timeGap < 86400) {
                                    currentEquity += (lastPos * (effectivePrice - lastPrice) * 50) / 10000;
                                }
                            }

                            let displayTime = trade.t;
                            if (displayTime <= (equityCurve.length > 0 ? equityCurve[equityCurve.length-1].time : 0)) {
                                displayTime = (equityCurve.length > 0 ? equityCurve[equityCurve.length-1].time : 0) + 1;
                            }
                            equityCurve.push({ time: displayTime, value: currentEquity });

                            if (!isNaN(effectivePrice)) lastPrice = effectivePrice;
                            if (!isNaN(trade.pos)) lastPos = trade.pos;
                            lastTime = trade.t;
                        });

                        lineSeries.setData(equityCurve);
                        chart.timeScale().fitContent();
                        writeLog(`全量真跡渲染完畢`, `Full Artifact Rendered.`, "ok");
                    } catch (err) {
                        writeLog("引擎引導異常", err.message, "err");
                    }
                }
            });
        }
    </script>
</body>
</html>
