<!DOCTYPE html>
<html>
<head>
    <title>Sovereign System V7.6 - Final Alignment</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 620px; border: 1px solid #30363d; margin-top: 20px; background: #000; border-radius: 8px; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; line-height: 1.6; }
        .ok { color: #3fb950; font-weight: bold; }
        .info { color: #d29922; }
        .err { color: #f85149; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2>🏛️ 九年量化實證：虛擬結算 (V7.6)</h2>
        <span style="font-size: 14px; color: #8b949e;">V7.6 Flagship: Mark-to-Market Engine</span>
    </div>
    <div id="log">系統熱啟動中... System Warm Booting...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(cn, en, className = '') {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span class="${className}">[${time}] ${cn} | ${en}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            writeLog("連線物理數據源", "Connecting to Data Source: data.csv", "info");
            
            Papa.parse("data.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true, borderVisible: true },
                            localization: { priceFormatter: p => p.toFixed(2) + ' 萬' },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({ 
                            color: '#2962ff', 
                            lineWidth: 3, 
                            title: '帳戶淨值 Equity (萬)' 
                        });

                        // 1. 強健的數據清洗引擎
                        writeLog("執行數據清洗", "Executing Data Scrubbing...");
                        const clean = (val) => {
                            if (!val) return NaN;
                            let res = parseFloat(String(val).replace(/[^-0-9.]/g, ''));
                            return isNaN(res) ? NaN : res;
                        };

                        let rawData = results.data.map(row => {
                            const tStr = row["交易時間"] || row["郵件日期"];
                            if (!tStr) return null;
                            
                            return {
                                t: new Date(tStr.replace(/\//g, '-')).getTime() / 1000,
                                price: clean(row["價格"]),
                                pos: clean(row["倉位後"])
                            };
                        })
                        // 關鍵：過濾掉任何價格或倉位為空的行 (排除系統訊息)
                        .filter(d => d !== null && !isNaN(d.t) && !isNaN(d.price) && !isNaN(d.pos))
                        .sort((a, b) => a.t - b.t);

                        writeLog(`有效交易真跡: ${rawData.length} 筆`, `Valid Trade Artifacts: ${rawData.length} records`, "ok");

                        // 2. 盯市累計積算 (起始 5 萬)
                        let currentEquity = 5.0; 
                        let lastPrice = rawData[0].price;
                        let lastPos = 0;
                        let lastTime = 0;
                        const equityCurve = [];

                        rawData.forEach((trade) => {
                            // 損益 = 前一筆倉位 * (現價 - 前價) * 50 / 10000
                            const pnl = (lastPos * (trade.price - lastPrice) * 50) / 10000;
                            currentEquity += pnl;

                            let adjustedTime = trade.t;
                            if (adjustedTime <= lastTime) adjustedTime = lastTime + 1;
                            lastTime = adjustedTime;

                            equityCurve.push({ time: adjustedTime, value: currentEquity });

                            lastPrice = trade.price;
                            lastPos = trade.pos;
                        });

                        lineSeries.setData(equityCurve);
                        chart.timeScale().fitContent();
                        
                        writeLog(`結算完成。最終權益: ${currentEquity.toFixed(2)} 萬`, "Clearing Complete.", "ok");

                    } catch (err) {
                        writeLog("引擎故障", "Engine Malfunction: " + err.message, "err");
                        console.error(err);
                    }
                }
            });
        }
    </script>
</body>
</html>
