<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Logic V8.0 - Full Spectrum Alignment</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 620px; border: 1px solid #30363d; margin-top: 20px; background: #000; border-radius: 8px; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; line-height: 1.6; }
        .ok { color: #3fb950; font-weight: bold; }
        .warn { color: #f1e05a; }
        .err { color: #f85149; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2>🏛️ 九年量化實證：全量真跡恢復 (V8.0)</h2>
        <span style="font-size: 14px; color: #8b949e;">V8.0 Full-Spectrum MTM Engine</span>
    </div>
    <div id="log">正在重啟引導程序... Booting...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(cn, en, className = '') {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span class="${className}">[${time}] ${cn} | ${en}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            writeLog("執行全量掃描", "Scanning Full Dataset: data.csv", "info");
            
            Papa.parse("data.csv", {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true, borderVisible: true },
                            localization: { priceFormatter: p => p.toFixed(2) + ' 萬' },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 3, title: '淨值 Equity (萬)' });

                        const cleanNum = (v) => {
                            if (v === undefined || v === null || v === "") return NaN;
                            let res = parseFloat(String(v).replace(/[^-0.9.]/g, ''));
                            return isNaN(res) ? NaN : res;
                        };

                        // 1. 寬鬆解析：只要有時間與價格/倉位其一就保留
                        let rawData = results.data.map(row => {
                            const tStr = row["交易時間"] || row["郵件日期"];
                            return {
                                t: tStr ? new Date(tStr.replace(/\//g, '-')).getTime() / 1000 : null,
                                price: cleanNum(row["價格"]),
                                pos: cleanNum(row["倉位後"])
                            };
                        })
                        .filter(d => d.t !== null && (!isNaN(d.price) || !isNaN(d.pos)))
                        .sort((a, b) => a.t - b.t);

                        writeLog(`真跡還原成功: ${rawData.length} 筆`, `Artifacts Restored: ${rawData.length} records`, "ok");

                        // 2. 專業盯市引擎 (含入金修正)
                        let currentEquity = 5.0; // 起始 5 萬
                        let lastPrice = NaN;
                        let lastPos = 0;
                        let lastTime = 0;
                        const equityCurve = [];

                        rawData.forEach((trade, index) => {
                            // 自動補全價格：若當前筆無價格，使用前一筆
                            if (isNaN(trade.price)) trade.price = lastPrice;
                            
                            // 2018 年入金校準 (根據您的年度表，2018 追加入金 36 萬)
                            const tradeDate = new Date(trade.t * 1000);
                            if (tradeDate.getFullYear() === 2018 && tradeDate.getMonth() === 0 && tradeDate.getDate() === 1) {
                                currentEquity += 36.0;
                                writeLog("執行 2018 入金校準", "Applying 2018 Deposit: +360k", "info");
                            }

                            // 損益計算 (若為第一筆或價格無效則跳過)
                            if (!isNaN(lastPrice) && !isNaN(trade.price)) {
                                // 損益 = 前筆倉位 * (現價 - 前價) * 50 / 10000
                                const pnl = (lastPos * (trade.price - lastPrice) * 50) / 10000;
                                currentEquity += pnl;
                            }

                            let displayTime = trade.t;
                            if (displayTime <= (equityCurve.length > 0 ? equityCurve[equityCurve.length-1].time : 0)) {
                                displayTime = equityCurve[equityCurve.length-1].time + 1;
                            }

                            equityCurve.push({ time: displayTime, value: currentEquity });

                            // 更新暫存器
                            if (!isNaN(trade.price)) lastPrice = trade.price;
                            if (!isNaN(trade.pos)) lastPos = trade.pos;
                        });

                        lineSeries.setData(equityCurve);
                        chart.timeScale().fitContent();
                        
                        writeLog(`畢業典禮核算完畢。最終: ${currentEquity.toFixed(2)} 萬`, `Audit Complete. Final: ${currentEquity.toFixed(2)}0k`, "ok");

                    } catch (err) {
                        writeLog("引導中斷", "Boot Aborted: " + err.message, "err");
                    }
                }
            });
        }
    </script>
</body>
</html>
