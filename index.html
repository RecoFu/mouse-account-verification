<!DOCTYPE html>
<html>
<head>
    <title>Sovereign System Recovery</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 500px; border: 1px solid #30363d; margin-top: 20px; background: #000; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 250px; overflow-y: scroll; font-size: 13px; color: #58a6ff; }
        .err { color: #f85149; }
        .ok { color: #3fb950; }
        .info { color: #d29922; }
    </style>
</head>
<body>
    <h2>🛠️ 核心引導程序 (V5.2)</h2>
    <div id="log">正在初始化內存...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, className = '') {
            logEl.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        async function bootSequence() {
            try {
                writeLog("檢查外部協議...");
                if (typeof Papa === 'undefined') throw new Error("PapaParse 遺失");
                if (typeof LightweightCharts === 'undefined') throw new Error("TradingView 引擎遺失");
                writeLog("協議檢查: 正常", "ok");

                // 優先執行數據定址，避開線圖初始化可能的崩潰
                writeLog("正在請求物理鏈路: data.csv ...", "info");
                
                Papa.parse("data.csv", {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    error: function(err) {
                        writeLog("CSV 讀取中斷: " + JSON.stringify(err), "err");
                    },
                    complete: function(results) {
                        writeLog("數據鏈路建立成功，讀取位元: " + results.data.length, "ok");
                        
                        try {
                            const headers = results.meta.fields;
                            writeLog("檢測標頭: " + headers.join(" | "), "info");

                            // 初始化線圖引擎
                            writeLog("啟動繪圖引擎儀表板...");
                            const container = document.getElementById('chart');
                            const chart = LightweightCharts.createChart(container, {
                                layout: { background: { color: '#0d1117' }, textColor: '#c9d1d9' },
                                grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                                width: container.clientWidth,
                                height: 500,
                            });
                            
                            const lineSeries = chart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });
                            writeLog("引擎冷啟動成功", "ok");

                            // 數據清洗邏輯
                            let lastTime = 0;
                            const processedData = results.data.map((row, index) => {
                                const timeKey = headers.find(h => h.includes("時間") || h.includes("日期"));
                                const valueKey = headers.find(h => h.includes("倉位後"));
                                if (!row[timeKey] || row[valueKey] === undefined) return null;

                                let t = new Date(row[timeKey]).getTime() / 1000;
                                let v = parseFloat(String(row[valueKey]).replace(/,/g, ''));
                                if (isNaN(t) || isNaN(v)) return null;

                                if (t <= lastTime) { t = lastTime + 1; }
                                lastTime = t;
                                return { time: t, value: v };
                            }).filter(d => d !== null);

                            if (processedData.length > 0) {
                                lineSeries.setData(processedData);
                                chart.timeScale().fitContent();
                                writeLog(">>> 真跡渲染完成。系統已上線。", "ok");
                            } else {
                                writeLog("數據解析失敗: 內容不符合 4M 規範", "err");
                            }
                        } catch (innerErr) {
                            writeLog("線圖引擎崩潰: " + innerErr.message, "err");
                        }
                    }
                });
            } catch (globalErr) {
                writeLog("系統引導失敗: " + globalErr.message, "err");
            }
        }

        window.onload = bootSequence;
    </script>
</body>
</html>
