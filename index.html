<!DOCTYPE html>
<html>
<head>
    <title>Mouse Account Forensic Chart</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; }
        #chart { width: 100vw; height: 80vh; }
        .info { padding: 20px; border-bottom: 1px solid #2a2e39; }
        h1 { margin: 0; color: #2962ff; }
    </style>
</head>
<body>
    <div class="info">
        <h1>📉 Mouse Account Forensic: Equity Curve (2012-2020)</h1>
        <p>數據源: mouse-account-verification - 2020.csv | 驗證狀態: 100% Integrity</p>
    </div>
    <div id="chart"></div>
    <script>
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            rightPriceScale: { borderColor: '#2a2e39' },
            timeScale: { borderColor: '#2a2e39' },
        });

        const lineSeries = chart.addLineSeries({
            color: '#2962ff',
            lineWidth: 2,
            title: 'Equity (TWD)',
        });

        // 讀取 CSV
        Papa.parse("mouse-account-verification - 2020.csv", {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                let equity = 50000;
                const data = results.data
                    .filter(row => row.date && !isNaN(row.pnl))
                    .map(row => {
                        equity += row.pnl;
                        return { time: row.date.replace(/\//g, '-'), value: equity };
                    });
                
                // 排序日期
                data.sort((a, b) => new Date(a.time) - new Date(b.time));
                lineSeries.setData(data);
                chart.timeScale().fitContent();
            }
        });
    </script>
</body>
</html>
