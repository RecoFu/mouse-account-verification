<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Logic Check</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 20px; }
        #chart { width: 100%; height: 500px; border: 1px solid #30363d; margin-top: 20px; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 200px; overflow-y: scroll; font-size: 13px; line-height: 1.5; color: #58a6ff; }
        .critical { color: #f85149; font-weight: bold; }
        .success { color: #3fb950; }
    </style>
</head>
<body>
    <h2>🚀 系統底層掃描中...</h2>
    <div id="log">系統啟動中...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, className = '') {
            logEl.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        // 1. 檢查函式庫是否加載
        writeLog("檢查外部協議...");
        if (typeof LightweightCharts !== 'undefined') {
            writeLog("TradingView 繪圖引擎: 載入成功 ✓", "success");
        } else {
            writeLog("錯誤: 無法載入 TradingView 函式庫，請檢查網路連接！", "critical");
        }

        if (typeof Papa !== 'undefined') {
            writeLog("PapaParse 解析引擎: 載入成功 ✓", "success");
        } else {
            writeLog("錯誤: 無法載入 PapaParse，請檢查網路連接！", "critical");
        }

        // 2. 初始化線圖
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#0d1117', textColor: '#c9d1d9' },
            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
        });
        const lineSeries = chart.addLineSeries({ color: '#58a6ff', lineWidth: 2 });

        // 3. 讀取數據 (關鍵尋址)
        writeLog("正在定址 data.csv ...");
        
        Papa.parse("data.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            error: function(err) {
                writeLog("物理層讀取錯誤: " + JSON.stringify(err), "critical");
            },
            complete: function(results) {
                writeLog("讀取成功，獲取位元流筆數: " + results.data.length);
                
                // 檢查欄位名 (這最容易出錯)
                const headers = results.meta.fields;
                writeLog("檢測到 CSV 標頭: " + headers.join(" | "));

                let lastTime = 0;
                const processedData = results.data.map((row, index) => {
                    // 自動匹配欄位 (相容 交易時間 或 郵件日期)
                    const timeKey = headers.find(h => h.includes("時間") || h.includes("日期"));
                    const valueKey = headers.find(h => h.includes("倉位後"));

                    if (!timeKey || !valueKey) return null;

                    let t = new Date(row[timeKey]).getTime() / 1000;
                    let v = parseFloat(String(row[valueKey]).replace(/,/g, ''));

                    if (isNaN(t) || isNaN(v)) return null;

                    // 處理重複時間
                    if (t <= lastTime) { t = lastTime + 1; }
                    lastTime = t;

                    return { time: t, value: v };
                }).filter(d => d !== null);

                if (processedData.length > 0) {
                    writeLog("數據校準完成，渲染線圖中...", "success");
                    lineSeries.setData(processedData);
                    chart.timeScale().fitContent();
                    writeLog("終端就緒。真跡已呈現。", "success");
                } else {
                    writeLog("錯誤: 數據解析後為空，請確認 CSV 內容是否有有效數值。", "critical");
                }
            }
        });
    </script>
</body>
</html>
