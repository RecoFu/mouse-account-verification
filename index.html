<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Equity Curve Alignment</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 600px; border: 1px solid #30363d; margin-top: 20px; background: #000; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; }
        .ok { color: #3fb950; }
        .info { color: #d29922; }
    </style>
</head>
<body>
    <h2>🏛️ 九年量化實證：淨值真跡線圖 (V6.5)</h2>
    <div id="log">系統重新引導中...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, className = '') {
            logEl.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            writeLog("正在請求數據鏈路: data.csv ...", "info");
            
            Papa.parse("data.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    writeLog("數據讀取成功，筆數: " + results.data.length, "ok");
                    
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true, borderColor: '#30363d' },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({
                            color: '#2962ff',
                            lineWidth: 3,
                            priceLineVisible: true,
                            title: '帳戶淨值 (Net Equity)'
                        });

                        // Step 1: 解析並進行全局物理排序
                        let rawParsed = results.data.map(row => {
                            const timeVal = row["交易時間"] || row["郵件日期"];
                            const pnlVal = row["pnl"]; // 使用損益欄位
                            if (!timeVal) return null;

                            const pnl = parseFloat(String(pnlVal).replace(/,/g, '')) || 0;
                            const t = new Date(timeVal.replace(/\//g, '-')).getTime() / 1000;
                            
                            return { time: t, pnl: pnl };
                        }).filter(d => d !== null && !isNaN(d.time));

                        rawParsed.sort((a, b) => a.time - b.time);

                        // Step 2: 累計積算 (Initial Capital = 50,000)
                        writeLog("執行累計損益積算 (Initial: 50,000)...", "info");
                        
                        let currentEquity = 50000;
                        let lastTime = 0;
                        const equityData = [];

                        rawParsed.forEach((d, index) => {
                            currentEquity += d.pnl; // 每一筆 PnL 累加到淨值上
                            
                            let adjustedTime = d.time;
                            if (adjustedTime <= lastTime) {
                                adjustedTime = lastTime + 1;
                            }
                            lastTime = adjustedTime;

                            equityData.push({ time: adjustedTime, value: currentEquity });
                        });

                        if (equityData.length > 0) {
                            lineSeries.setData(equityData);
                            chart.timeScale().fitContent();
                            
                            const peak = Math.max(...equityData.map(d => d.value));
                            writeLog(`>>> 淨值曲線已生成。峰值: ${peak.toLocaleString()}`, "ok");
                        }

                    } catch (err) {
                        writeLog("引擎致命錯誤: " + err.message, "err");
                    }
                }
            });
        }
    </script>
</body>
</html>
