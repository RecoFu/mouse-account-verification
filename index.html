<!DOCTYPE html>
<html>
<head>
    <title>Equity Curve - Mouse Account Verification</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #131722; color: white; font-family: sans-serif; margin: 20px; }
        #chart { width: 100%; height: 600px; border-radius: 4px; border: 1px solid #2b2b43; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .box { background: #1e222d; padding: 15px; border-radius: 8px; flex: 1; border-bottom: 4px solid #2962ff; }
        #status { color: #f96; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🏛️ 九年量化實證全量數據 (2012-2020)</h2>
    <div class="stats">
        <div class="box">起始: 50,000</div>
        <div class="box">峰值: 1,350,000 (2019)</div>
        <div class="box">結業: 30,000 (2020/3/18)</div>
    </div>
    <div id="chart"></div>
    <div id="status">系統初始化中...</div>

    <script>
        const statusEl = document.getElementById('status');
        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2b2b43' }, horzLines: { color: '#2b2b43' } },
            timeScale: { timeVisible: true, secondsVisible: true }
        });

        const lineSeries = chart.addLineSeries({
            color: '#2962ff',
            lineWidth: 2,
            title: '淨值 (Equity)',
        });

        // 核心：嘗試自動匹配多種可能檔名
        const csvFile = "data.csv"; 

        Papa.parse(csvFile, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                console.log("原始數據筆數:", results.data.length);
                
                let processedData = results.data
                    .map((row, index) => {
                        // 1. 抓取時間與數值，處理可能的空值
                        const timeStr = row['交易時間'] || row['郵件日期'];
                        let val = row['倉位後'];
                        
                        if (!timeStr || val === undefined) return null;

                        // 2. 處理數值中的逗號 (如 1,350,000 -> 1350000)
                        if (typeof val === 'string') val = parseFloat(val.replace(/,/g, ''));

                        // 3. 轉換時間戳
                        const t = new Date(timeStr).getTime() / 1000;
                        
                        // 4. 為了防止重複時間點導致繪圖失敗，微調秒數
                        return { time: t + (index * 0.001), value: val };
                    })
                    .filter(d => d !== null && !isNaN(d.time) && !isNaN(d.value))
                    .sort((a, b) => a.time - b.time);

                if (processedData.length > 0) {
                    lineSeries.setData(processedData);
                    chart.timeScale().fitContent();
                    statusEl.innerText = "系統就緒：已載入 " + processedData.length + " 筆真跡紀錄。";
                    statusEl.style.color = "#4caf50";
                } else {
                    statusEl.innerText = "錯誤：未能解析數據，請檢查 CSV 欄位名稱是否包含 '交易時間' 與 '倉位後'。";
                }
            },
            error: function(err) {
                statusEl.innerText = "數據鏈路斷開: " + err;
            }
        });
    </script>
</body>
</html>
