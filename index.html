<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Data Adaptive Alignment</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 600px; border: 1px solid #30363d; margin-top: 20px; background: #000; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; }
        .ok { color: #3fb950; }
        .warn { color: #d29922; font-weight: bold; }
    </style>
</head>
<body>
    <h2>🏛️ 九年量化實證：真跡校準 (V6.6)</h2>
    <div id="log">系統偵測中...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, className = '') {
            logEl.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            writeLog("正在掃描數據源: data.csv ...", "info");
            
            Papa.parse("data.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const headers = results.meta.fields;
                        writeLog("檢測標頭: " + headers.join(" | "), "info");

                        // 尋找損益欄位 (相容多種標頭名稱)
                        const pnlKey = headers.find(h => 
                            h.toLowerCase().includes("pnl") || 
                            h.includes("損益") || 
                            h.includes("收益") ||
                            h.includes("交易損益")
                        );

                        if (!pnlKey) {
                            writeLog("⚠️ 警告: 在 CSV 中找不到『損益』欄位！將改為顯示『倉位動態』。", "warn");
                            drawPositionMode(results.data, headers);
                        } else {
                            writeLog(`成功對位損益欄位: 【${pnlKey}】`, "ok");
                            drawEquityMode(results.data, pnlKey, headers);
                        }

                    } catch (err) {
                        writeLog("引導失敗: " + err.message, "err");
                    }
                }
            });
        };

        function drawEquityMode(data, pnlKey, headers) {
            const chart = createBaseChart();
            const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 3, title: '淨值 (Equity)' });
            
            let currentEquity = 50000;
            let lastTime = 0;
            const timeKey = headers.find(h => h.includes("時間") || h.includes("日期"));

            const equityData = data.map(row => {
                const t = new Date(row[timeKey].replace(/\//g, '-')).getTime() / 1000;
                const pnl = parseFloat(String(row[pnlKey]).replace(/,/g, '')) || 0;
                return { t, pnl };
            }).sort((a, b) => a.t - b.t).map((d, i) => {
                currentEquity += d.pnl;
                let adjustedTime = d.t;
                if (adjustedTime <= lastTime) adjustedTime = lastTime + 1;
                lastTime = adjustedTime;
                return { time: adjustedTime, value: currentEquity };
            });

            lineSeries.setData(equityData);
            chart.timeScale().fitContent();
            writeLog(`>>> 淨值曲線已生成。`, "ok");
        }

        function drawPositionMode(data, headers) {
            const chart = createBaseChart();
            const lineSeries = chart.addLineSeries({ color: '#f96', lineWidth: 2, title: '倉位 (Position)' });
            
            const timeKey = headers.find(h => h.includes("時間") || h.includes("日期"));
            const posKey = headers.find(h => h.includes("倉位後"));

            let lastTime = 0;
            const posData = data.map(row => {
                const t = new Date(row[timeKey].replace(/\//g, '-')).getTime() / 1000;
                const val = parseFloat(row[posKey]) || 0;
                return { t, val };
            }).sort((a, b) => a.t - b.t).map(d => {
                let adjustedTime = d.t;
                if (adjustedTime <= lastTime) adjustedTime = lastTime + 1;
                lastTime = adjustedTime;
                return { time: adjustedTime, value: d.val };
            });

            lineSeries.setData(posData);
            chart.timeScale().fitContent();
            writeLog(`>>> 已回退至倉位模式呈現。`, "info");
        }

        function createBaseChart() {
            return LightweightCharts.createChart(document.getElementById('chart'), {
                layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                timeScale: { borderColor: '#30363d', timeVisible: true }
            });
        }
    </script>
</body>
</html>
