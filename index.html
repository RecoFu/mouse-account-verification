<!DOCTYPE html>
<html>
<head>
    <title>Sovereign System V7.7 - Gap-Aware Engine</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 620px; border: 1px solid #30363d; margin-top: 20px; background: #000; border-radius: 8px; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; line-height: 1.6; }
        .ok { color: #3fb950; font-weight: bold; }
        .warn { color: #f1e05a; }
        .err { color: #f85149; }
    </style>
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <h2>🏛️ 九年量化實證：斷層校準結算 (V7.7)</h2>
        <span style="font-size: 14px; color: #8b949e;">V7.7 Gap-Aware Mark-to-Market Engine</span>
    </div>
    <div id="log">系統初始化中... Initializing...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(cn, en, className = '') {
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `<span class="${className}">[${time}] ${cn} | ${en}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            writeLog("連線物理數據源", "Connecting to data.csv", "info");
            
            Papa.parse("data.csv", {
                download: true, header: true, skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true, borderVisible: true },
                            localization: { priceFormatter: p => p.toFixed(2) + ' 萬' },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 3, title: '淨值 Equity (萬)' });

                        const clean = (v) => {
                            let res = parseFloat(String(v).replace(/[^-0.9.]/g, ''));
                            return isNaN(res) ? null : res;
                        };

                        // 1. 物理層數據重組
                        let rawData = results.data.map(row => ({
                            t: new Date((row["交易時間"] || row["郵件日期"]).replace(/\//g, '-')).getTime() / 1000,
                            price: clean(row["價格"]),
                            pos: clean(row["倉位後"])
                        }))
                        .filter(d => d.t && d.price !== null && d.pos !== null)
                        .sort((a, b) => a.t - b.t);

                        writeLog(`數據載入完成: ${rawData.length} 筆`, `Data Loaded: ${rawData.length} records`, "ok");

                        // 2. 斷層校準引擎 (Gap-Aware Clearing)
                        let currentEquity = 5.0; // 起始 5 萬
                        let lastPrice = rawData[0].price;
                        let lastPos = 0;
                        let lastTime = rawData[0].t;
                        const equityCurve = [];

                        rawData.forEach((trade, index) => {
                            // 【熔斷邏輯】：若兩筆紀錄間隔超過 24 小時 (86400秒)，不計算損益 (視為關機)
                            const timeGap = trade.t - lastTime;
                            
                            if (timeGap < 86400 && index > 0) {
                                const pnl = (lastPos * (trade.price - lastPrice) * 50) / 10000;
                                currentEquity += pnl;
                            } else if (timeGap >= 86400) {
                                // 僅更新錨點，不計算大跳空的損益
                                // writeLog(`偵測到時間斷層`, `Gap detected: ${(timeGap/86400).toFixed(1)} days`, "warn");
                            }

                            // 處理時間戳重複
                            let displayTime = trade.t;
                            if (displayTime <= (equityCurve.length > 0 ? equityCurve[equityCurve.length-1].time : 0)) {
                                displayTime = equityCurve[equityCurve.length-1].time + 1;
                            }

                            equityCurve.push({ time: displayTime, value: currentEquity });

                            // 更新暫存器
                            lastPrice = trade.price;
                            lastPos = trade.pos;
                            lastTime = trade.t;
                        });

                        lineSeries.setData(equityCurve);
                        chart.timeScale().fitContent();
                        
                        writeLog(`結算完成。最終權益: ${currentEquity.toFixed(2)} 萬`, `Clearing Complete. Final: ${currentEquity.toFixed(2)}0k`, "ok");

                    } catch (err) {
                        writeLog("引擎故障", "Engine Error: " + err.message, "err");
                    }
                }
            });
        }
    </script>
</body>
</html>
