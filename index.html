<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Virtual Clearing Engine</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: 'Courier New', monospace; margin: 20px; }
        #chart { width: 100%; height: 600px; border: 1px solid #30363d; margin-top: 20px; background: #000; }
        #log { background: #161b22; padding: 15px; border-radius: 6px; border: 1px solid #30363d; height: 180px; overflow-y: scroll; font-size: 13px; color: #58a6ff; }
        .ok { color: #3fb950; }
        .info { color: #d29922; }
    </style>
</head>
<body>
    <h2>🏛️ 九年量化實證：虛擬結算真跡 (V7.0)</h2>
    <div id="log">啟動虛擬結算引擎...<br></div>
    <div id="chart"></div>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, className = '') {
            logEl.innerHTML += `<span class="${className}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        window.onload = function() {
            Papa.parse("data.csv", {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    try {
                        const container = document.getElementById('chart');
                        const chart = LightweightCharts.createChart(container, {
                            layout: { backgroundColor: '#0d1117', textColor: '#d1d4dc' },
                            grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
                            priceScale: { autoScale: true },
                            timeScale: { borderColor: '#30363d', timeVisible: true }
                        });

                        const lineSeries = chart.addLineSeries({ color: '#2962ff', lineWidth: 3, title: '推估淨值 (Equity)' });

                        // 1. 物理排序
                        let data = results.data.map(row => ({
                            t: new Date((row["交易時間"] || row["郵件日期"]).replace(/\//g, '-')).getTime() / 1000,
                            price: parseFloat(row["價格"]),
                            qtyChange: parseFloat(row["數量"]),
                            posAfter: parseFloat(row["倉位後"])
                        })).filter(d => !isNaN(d.t) && !isNaN(d.price)).sort((a, b) => a.t - b.t);

                        // 2. 虛擬結算邏輯
                        writeLog("執行虛擬結算中 (小型台指 1點=50元)...", "info");
                        let equity = 1350000; // 2020 起始資金
                        let avgCost = 0;
                        let currentPos = 0;
                        let lastTime = 0;
                        const equityCurve = [];

                        data.forEach((trade, index) => {
                            const tradePrice = trade.price;
                            const change = trade.qtyChange;
                            
                            if (change !== 0) {
                                // 判斷是加碼還是減碼 (實現損益)
                                if (currentPos > 0 && change < 0) { 
                                    // 多單減碼 -> 實現損益
                                    const closedQty = Math.abs(change);
                                    equity += (tradePrice - avgCost) * closedQty * 50;
                                } else if (currentPos < 0 && change > 0) {
                                    // 空單回補 -> 實現損益
                                    const closedQty = Math.abs(change);
                                    equity += (avgCost - tradePrice) * closedQty * 50;
                                }

                                // 更新持倉成本
                                const nextPos = currentPos + change;
                                if (nextPos === 0) {
                                    avgCost = 0;
                                } else if (Math.sign(nextPos) === Math.sign(currentPos)) {
                                    // 同向加碼: 更新加權成本
                                    if (change > 0 && nextPos > 0 || change < 0 && nextPos < 0) {
                                        avgCost = ((Math.abs(currentPos) * avgCost) + (Math.abs(change) * tradePrice)) / Math.abs(nextPos);
                                    }
                                } else {
                                    // 換手或新開倉
                                    avgCost = tradePrice;
                                }
                                currentPos = nextPos;
                            }

                            // 處理時間戳重複
                            let adjustedTime = trade.t;
                            if (adjustedTime <= lastTime) adjustedTime = lastTime + 1;
                            lastTime = adjustedTime;

                            equityCurve.push({ time: adjustedTime, value: equity });
                        });

                        lineSeries.setData(equityCurve);
                        chart.timeScale().fitContent();
                        writeLog(`>>> 結算完成。最終推估權益: ${equity.toLocaleString()}`, "ok");

                    } catch (err) {
                        writeLog("引擎中斷: " + err.message, "err");
                    }
                }
            });
        }
    </script>
</body>
</html>
